[package]
name = "hifiberry-tts"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Home Assistant URL announcements over PipeWire with background stream ducking"

[dependencies]
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
symphonia = { version = "0.5.5", default-features = false, features = ["pcm", "wav", "mp3", "flac", "vorbis", "ogg", "aac", "isomp4"] }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.9.2", features = ["v0_3_49"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
